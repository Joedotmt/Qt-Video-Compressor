<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Compressor</title>
    <style>
        :root {
            --primary: #0078d4;
            --primary-hover: #106ebe;
            --secondary: #f3f3f3;
            --bg-dark: #000000;
            --bg-card: #111111;
            --bg-input: #242424;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border: #404040;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            --error: #f48771;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        .container {
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: left;
            margin-bottom: 30px;
            animation: none;
        }

        h1 {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: normal;
            background: none;
            -webkit-background-clip: unset;
            -webkit-text-fill-color: unset;
            background-clip: unset;
            margin-bottom: 5px;
            text-transform: none;
            color: var(--text-primary);
        }

        .card {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: none;
            animation: none;
        }

        .card:hover {
            transform: none;
            box-shadow: var(--shadow);
        }

        .card:nth-child(2) {
            animation-delay: unset;
        }

        .card:nth-child(3) {
            animation-delay: unset;
        }

        .card:nth-child(4) {
            animation-delay: unset;
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .drop-zone::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: none;
            opacity: 0;
        }

        .drop-zone:hover::before {
            opacity: 0;
        }

        .drop-zone.drag-over {
            border-color: var(--primary);
            background: rgba(0, 120, 212, 0.15);
            transform: none;
        }

        .drop-zone:hover {
            border-color: var(--primary);
            box-shadow: none;
        }

        .drop-text {
            font-size: 1rem;
            color: var(--text-primary);
            margin-bottom: 5px;
            font-weight: 500;
        }

        .drop-subtext {
            font-size: 0.85rem;
            color: var(--text-secondary);
            opacity: 1;
        }

        .file-info {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 120, 212, 0.1);
            border-radius: 6px;
            border-left: none;
        }

        .file-info.visible {
            display: block;
            animation: none;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: none;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .info-value {
            color: var(--primary);
            font-weight: 600;
            font-family: 'Segoe UI', sans-serif;
        }

        .tabs {
            display: flex;
            gap: 2px;
            overflow-x: auto;
            padding-bottom: 0;
        }

        .tab-content-container {
            background-color: var(--bg-card);
            padding: 15px;
            border: 3px solid var(--border);
            border-radius: 10px;
            border-top-left-radius: 0;
            height: 300px;
        }

        .tab {
            padding: 7px 16px;
            background: var(--bg-card);
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: normal;
            white-space: nowrap;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--text-primary);
            background-color: var(--border);
            text-shadow: none;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: none;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-primary);
            font-size: 0.85rem;
            text-transform: none;
            letter-spacing: normal;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.1);
        }

        input:disabled,
        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-unit {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.85rem;
            min-width: 45px;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: var(--border);
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: none;
            letter-spacing: normal;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: none;
        }

        .btn:hover::before {
            width: 0;
            height: 0;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: none;
            box-shadow: none;
        }

        .btn:active {
            transform: none;
        }

        .btn:disabled {
            background: var(--bg-input);
            color: var(--text-secondary);
            cursor: not-allowed;
            opacity: 1;
        }

        .btn:disabled:hover {
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-secondary:hover {
            background: rgba(0, 120, 212, 0.2);
            border-color: var(--primary-hover);
        }

        .progress-container {
            display: none;
            margin-top: 20px;
        }

        .progress-container.visible {
            display: block;
            animation: none;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            box-shadow: none;
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: none;
            animation: none;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .progress-text {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 10px;
        }

        .status-processing {
            background: rgba(0, 120, 212, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .status-completed {
            background: rgba(0, 120, 212, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .status-failed {
            background: rgba(197, 15, 31, 0.1);
            color: var(--error);
            border: 1px solid var(--error);
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            border: none;
        }

        .checkbox-wrapper:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .checkbox-label {
            font-size: 0.9rem;
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 500;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .error-message {
            padding: 12px;
            background: rgba(244, 135, 113, 0.15);
            border: 1px solid var(--error);
            border-radius: 6px;
            color: var(--error);
            margin-top: 12px;
            display: none;
        }

        .error-message.visible {
            display: block;
            animation: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }

            .grid-2 {
                grid-template-columns: 1fr;
            }

            .tabs {
                gap: 5px;
            }

            .tab {
                padding: 8px 12px;
                font-size: 0.8rem;
            }
        }

        .download-section {
            display: none;
            margin-top: 15px;
        }

        .download-section.visible {
            display: block;
            animation: none;
        }

        .download-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(0, 120, 212, 0.1);
            border-radius: 6px;
            margin-bottom: 12px;
            border-left: none;
        }

        .download-stats {
            display: flex;
            gap: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 1.1rem;
            color: var(--primary);
            font-weight: 700;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
    </style>
</head>

<body>
    <div class="container">
        <div style="margin-bottom: 1em;">
            <div class="drop-zone" id="dropZone">
                <div class="drop-text">Drag & Drop Video</div>
                <div class="drop-subtext">or click to browse</div>
            </div>
            <input type="file" id="fileInput" accept="video/*" style="display: none;">

            <div class="file-info" id="fileInfo">
                <div class="info-row">
                    <span class="info-label">Filename:</span>
                    <span class="info-value" id="fileName">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Duration:</span>
                    <span class="info-value" id="fileDuration">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Resolution:</span>
                    <span class="info-value" id="fileResolution">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">FPS:</span>
                    <span class="info-value" id="fileFps">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Size:</span>
                    <span class="info-value" id="fileSize">-</span>
                </div>
            </div>
        </div>

        <div class="tabs-card">
            <div class="tabs">
                <button class="tab active" data-tab="size">File Size</button>
                <button class="tab" data-tab="video">Video</button>
                <button class="tab" data-tab="audio">Audio</button>
                <button class="tab" data-tab="encoder">Encoder</button>
            </div>

            <div class="tab-content-container">
                <div class="tab-content active" id="size-tab">
                    <div class="input-group">
                        <label class="input-label">Target Size</label>
                        <div class="input-wrapper">
                            <input type="number" id="targetSize" placeholder="Enter target size" step="0.01">
                            <span class="input-unit">MB</span>
                        </div>
                    </div>


                    <div class="input-group">
                        <div class="input-label">Estimated Video Bitrate</div>
                        <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
                            <input type="text" id="estimatedBitrate" readonly disabled style="flex: 1;">
                            <span class="input-unit">kbps</span>
                        </div>
                    </div>

                    <button class="btn btn-secondary" id="matchSourceSize">Match Source</button>
                </div>

                <div class="tab-content" id="video-tab">
                    <div class="input-group">
                        <label class="input-label">Resolution</label>
                        <div class="grid-2">
                            <div class="input-wrapper">
                                <input type="number" id="width" placeholder="Width">
                                <span class="input-unit">px</span>
                            </div>
                            <div class="input-wrapper">
                                <input type="number" id="height" placeholder="Height">
                                <span class="input-unit">px</span>
                            </div>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Frame Rate</label>
                        <div class="input-wrapper">
                            <input type="number" id="fps" placeholder="FPS" step="0.01">
                            <span class="input-unit">fps</span>
                        </div>
                    </div>

                    <button class="btn btn-secondary" id="useSourceSettings">Match Source</button>

                    <div style="font-size: 15px; opacity: 0.5; margin: 3px;" id="videoPreview"></div>
                </div>

                <div class="tab-content" id="audio-tab">
                    <div class="input-group">
                        <div class="checkbox-wrapper">
                            <input type="checkbox" id="muteAudio">
                            <label class="checkbox-label" for="muteAudio">Mute Audio</label>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Audio Bitrate</label>
                        <div class="input-wrapper">
                            <input type="number" id="audioBitrate" placeholder="Enter audio bitrate">
                            <span class="input-unit">kbps</span>
                        </div>
                    </div>

                    <button class="btn btn-secondary" id="matchSourceAudio">Match Source</button>
                </div>

                <div class="tab-content" id="encoder-tab">
                    <div class="input-group">
                        <label class="input-label">Preset</label>
                        <select id="preset">
                            <option value="ultrafast">Ultrafast</option>
                            <option value="fast">Fast</option>
                            <option value="medium" selected>Medium</option>
                            <option value="slow">Slow</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label class="input-label">CRF (Constant Rate Factor)</label>
                        <div class="input-wrapper">
                            <input type="number" id="crf" placeholder="0-51, lower = better quality" min="0" max="51">
                            <span class="input-unit">CRF</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Tune</label>
                        <select id="tune">
                            <option value="None">None</option>
                            <option value="film">Film</option>
                            <option value="animation">Animation</option>
                            <option value="grain">Grain</option>
                            <option value="stillimage">Still Image</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="card" style="margin-top: 1em;">
            <button class="btn" id="compressBtn" disabled>Compress</button>

            <div class="error-message" id="errorMessage"></div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text">
                    <span class="status-badge status-processing" id="statusBadge">Processing</span>
                    <span id="progressText">0%</span>
                </div>
            </div>

            <div class="download-section" id="downloadSection">
                <div class="download-info">
                    <div class="download-stats">
                        <div class="stat">
                            <div class="stat-label">Output Size</div>
                            <div class="stat-value" id="outputSize">-</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">Compression</div>
                            <div class="stat-value" id="compressionRatio">-</div>
                        </div>
                    </div>
                </div>
                <button class="btn" id="downloadBtn">Download Video</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
