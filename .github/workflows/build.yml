name: Build Video Compressor

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install GTK runtime and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream \
            desktop-file-utils \
            ffmpeg \
            gir1.2-adw-1 \
            gir1.2-gtk-4.0 \
            python3-gi \
            xvfb

      - name: Run unit tests
        run: python3 -m unittest discover -v

      - name: Validate Python and GTK startup
        run: |
          python3 -m py_compile main.py compressor.py
          dbus-run-session -- xvfb-run -a python3 -m tests.smoke_startup

      - name: Run GTK compression smoke test
        run: dbus-run-session -- xvfb-run -a python3 -m tests.smoke_compression

      - name: Validate desktop metadata
        run: |
          desktop-file-validate data/io.github.Joedotmt.VideoCompressor.desktop
          appstreamcli validate --no-net data/io.github.Joedotmt.VideoCompressor.metainfo.xml

      - name: Check advertised FFmpeg encoders
        run: |
          ffmpeg -hide_banner -encoders 2>&1 | grep --quiet libx264
          ffmpeg -hide_banner -encoders 2>&1 | grep --quiet libx265
          ffmpeg -hide_banner -encoders 2>&1 | grep --quiet libaom-av1

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: VideoCompressor.flatpak
          manifest-path: io.github.Joedotmt.VideoCompressor.yml
          artifact-name: VideoCompressor-${{ runner.arch }}.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
