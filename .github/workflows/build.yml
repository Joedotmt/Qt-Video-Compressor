name: Build Joemt Video Compressor

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install GTK runtime and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream \
            desktop-file-utils \
            ffmpeg \
            gir1.2-adw-1 \
            gir1.2-gtk-4.0 \
            python3-gi \
            xvfb

      - name: Run unit tests
        run: python3 -m unittest discover -v

      - name: Validate Python and GTK startup
        run: |
          python3 -m py_compile main.py compressor.py
          dbus-run-session -- xvfb-run -a python3 -m tests.smoke_startup

      - name: Run GTK compression smoke test
        run: dbus-run-session -- xvfb-run -a python3 -m tests.smoke_compression

      - name: Validate desktop metadata
        run: |
          desktop-file-validate data/io.github.Joedotmt.JoemtVideoCompressor.desktop
          appstreamcli validate --no-net data/io.github.Joedotmt.JoemtVideoCompressor.metainfo.xml

      - name: Check advertised FFmpeg encoders
        run: |
          ffmpeg -hide_banner -encoders 2>&1 | grep --quiet libx264
          ffmpeg -hide_banner -encoders 2>&1 | grep --quiet libx265
          ffmpeg -hide_banner -encoders 2>&1 | grep --quiet libaom-av1

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: JoemtVideoCompressor.flatpak
          manifest-path: io.github.Joedotmt.JoemtVideoCompressor.yml
          artifact-name: JoemtVideoCompressor-${{ runner.arch }}.flatpak
          cache-key: flatpak-builder-${{ github.sha }}

  windows:
    name: Windows installer
    runs-on: windows-2022
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf input

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install MSYS2 UCRT64 build dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-pyinstaller

      - name: Run unit tests on Windows
        shell: msys2 {0}
        run: python -m unittest discover -v

      - name: Build Windows application and installer
        shell: msys2 {0}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/windows/build.ps1

      - name: Smoke test packaged application
        shell: pwsh
        timeout-minutes: 1
        run: .\dist\windows\JoemtVideoCompressor\JoemtVideoCompressor.exe --smoke-test

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: JoemtVideoCompressor-windows-x64
          path: |
            dist/windows/installer/*.exe
            dist/windows/installer/*.sha256
          if-no-files-found: error
